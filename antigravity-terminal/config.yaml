name: Antigravity Terminal
version: "1.0.1"
slug: antigravity_terminal
description: "Google Antigravity CLI web terminal for Home Assistant — build automations, Lovelace dashboards, and troubleshoot issues directly in HA."
url: "https://github.com/assafmiron/antigravity-home-assistant"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 7681
panel_icon: mdi:rocket-launch-outline
panel_title: Antigravity
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - homeassistant_config:rw
  - addon_config:rw
  - share:rw
  - ssl:ro
  - backup:rw
options:
  auto_launch_agy: true
  agy_auto_update: true
  use_tmux: true
  working_directory: "/config"
  execution_mode: "default"
  enable_safety_hooks: true
  auto_backup_before_edit: true
  gemini_api_key: ""
schema:
  auto_launch_agy: bool
  agy_auto_update: bool
  use_tmux: bool
  working_directory: str
  execution_mode: "list(default|accept-edits|auto|plan)"
  enable_safety_hooks: bool
  auto_backup_before_edit: bool
  gemini_api_key: "password?"
